name: Source checks and publication gate
# PRIVATE SOURCE REPOSITORY → checks → publication gate → PUBLIC DEPLOYMENT REPOSITORY
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'   # Daily feeds
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to gezhuang0717.github.io after the gate passes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: false
env:
  HUGO_VERSION: 0.166.0
jobs:
  daily:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: |
          python tools/site.py fetch
          python tools/site.py check
          git config user.name "Zhuang Ge"
          git config user.email gezhuang0717@users.noreply.github.com
          git add data/daily
          git diff --cached --quiet || { git commit -m "Daily feeds $(date -u +%F)"; git push origin HEAD:main; }
  gate:
    needs: daily
    if: always() && (needs.daily.result == 'success' || needs.daily.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - name: Install pinned Hugo Extended
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Tests
        run: python -m pytest tests -q
      - name: All themes build
        run: |
          python tools/site.py config
          for t in congo blowfish papermod; do hugo --minify --configDir "sites/$t" --themesDir themes --destination "builds/$t" --quiet; done
      - name: Publication gate (site check, privacy, geo, build, links, inspect public/)
        run: python tools/publish.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: public-gate-report.json
  publish:
    needs: gate
    # scheduled Daily updates publish automatically; anything else needs a manual run with publish=true
    if: always() && needs.gate.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.publish)
    runs-on: ubuntu-latest
    environment: publication-gate   # add required reviewers in Settings → Environments for a manual approval step
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Publish built site to the public repository
        env:
          PUBLIC_SITE_TOKEN: ${{ secrets.PUBLIC_SITE_TOKEN }}
        run: |
          test -n "$PUBLIC_SITE_TOKEN" || { echo "::error::Add secret PUBLIC_SITE_TOKEN (fine-grained token, Contents: read and write on gezhuang0717/gezhuang0717.github.io)"; exit 1; }
          python tools/publish.py push --approve --token-env PUBLIC_SITE_TOKEN
