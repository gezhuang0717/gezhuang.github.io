zg_lab_sim_note: "Ein geladenes Teilchen in einem starken Magnetfeld und einem schwachen elektrischen Quadrupolfeld bewegt sich auf zwei Kreisen zugleich – die schnelle modifizierte Zyklotronbewegung (ν₊) auf der langsamen Magnetronbewegung (ν₋) – und schwingt entlang der Feldachse (ν_z). Die Summe ν₊ + ν₋ = ν_c liefert die Masse."
