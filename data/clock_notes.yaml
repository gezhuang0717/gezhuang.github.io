# Daily line under the Jyväskylä clock — one per day of year (1..366).
# country: fi | cn | de | jp | uk     kind: proverb | joke | fact
notes:
  - country: fi
    kind: proverb
    text:
      en: "Learning never pushes you into a ditch."
      zh: "学习永远不会把人推进沟里。"
      fi: "Ei oppi ojaan kaada."
      de: "Lernen hat noch niemanden in den Graben gestoßen."
      ja: "学びが人を溝に落とすことはない。"
  - country: cn
    kind: proverb
    text:
      en: "A journey of a thousand miles begins with a single step. (Laozi)"
      zh: "千里之行，始于足下。"
      fi: "Tuhannen mailin matka alkaa yhdestä askeleesta."
      de: "Auch eine Reise von tausend Meilen beginnt mit dem ersten Schritt."
      ja: "千里の道も一歩から。"
  - country: de
    kind: proverb
    text:
      en: "Practice makes the master."
      zh: "熟能生巧。"
      fi: "Harjoitus tekee mestarin."
      de: "Übung macht den Meister."
      ja: "練習が名人を作る。"
  - country: jp
    kind: proverb
    text:
      en: "Fall seven times, get up eight."
      zh: "跌倒七次，第八次站起来。"
      fi: "Kaadu seitsemän kertaa, nouse kahdeksan."
      de: "Siebenmal hinfallen, achtmal aufstehen."
      ja: "七転び八起き。"
  - country: uk
    kind: proverb
    text:
      en: "Every cloud has a silver lining."
      zh: "每朵乌云都镶着银边。"
      fi: "Jokaisella pilvellä on hopeareunus."
      de: "Jede Wolke hat einen Silberstreif."
      ja: "どんな雲にも銀の裏地がある。"
  - country: fi
    kind: proverb
    text:
      en: "Your own land is a strawberry, other lands are blueberries."
      zh: "自己的土地是草莓，别人的土地只是蓝莓。"
      fi: "Oma maa mansikka, muu maa mustikka."
      de: "Das eigene Land ist eine Erdbeere, andere Länder sind Heidelbeeren."
      ja: "自分の国はイチゴ、よその国はブルーベリー。"
  - country: cn
    kind: proverb
    text:
      en: "When three walk together, one of them can be my teacher. (Confucius)"
      zh: "三人行，必有我师焉。"
      fi: "Kun kolme kulkee yhdessä, yksi heistä on varmasti opettajani."
      de: "Wenn drei zusammen gehen, ist gewiss einer mein Lehrer."
      ja: "三人行えば必ず我が師あり。"
  - country: de
    kind: proverb
    text:
      en: "All's well that ends well."
      zh: "结局好，一切都好。"
      fi: "Kaikki hyvin, kun loppu hyvin."
      de: "Ende gut, alles gut."
      ja: "終わりよければすべてよし。"
  - country: jp
    kind: proverb
    text:
      en: "Even monkeys fall from trees."
      zh: "猴子也会从树上掉下来。"
      fi: "Apinakin putoaa puusta."
      de: "Auch Affen fallen mal vom Baum."
      ja: "猿も木から落ちる。"
  - country: uk
    kind: proverb
    text:
      en: "Many hands make light work."
      zh: "人多好办事。"
      fi: "Monta kättä keventää työn."
      de: "Viele Hände machen der Arbeit ein schnelles Ende."
      ja: "手が多ければ仕事は軽くなる。"
  - country: fi
    kind: proverb
    text:
      en: "Good things come slowly."
      zh: "好东西要慢慢来。"
      fi: "Hiljaa hyvä tulee."
      de: "Das Gute kommt langsam."
      ja: "よいものはゆっくりやって来る。"
  - country: cn
    kind: proverb
    text:
      en: "Review the old to learn the new."
      zh: "温故而知新。"
      fi: "Kertaa vanhaa, niin opit uutta."
      de: "Das Alte wiederholen, um Neues zu erkennen."
      ja: "故きを温ねて新しきを知る。"
  - country: de
    kind: proverb
    text:
      en: "Order is half of life."
      zh: "秩序是生活的一半。"
      fi: "Järjestys on puoli elämää."
      de: "Ordnung ist das halbe Leben."
      ja: "整理整頓は人生の半分。"
  - country: jp
    kind: proverb
    text:
      en: "Three years on a stone: perseverance warms even a cold stone."
      zh: "在石头上坐三年，石头也会变暖。"
      fi: "Kolme vuotta kivellä: sinnikkyys lämmittää kylmänkin kiven."
      de: "Drei Jahre auf einem Stein: Ausdauer wärmt selbst kalten Stein."
      ja: "石の上にも三年。"
  - country: uk
    kind: proverb
    text:
      en: "A stitch in time saves nine."
      zh: "及时缝一针，省得缝九针。"
      fi: "Ajoissa tehty pisto säästää yhdeksän."
      de: "Ein Stich zur rechten Zeit erspart neun."
      ja: "適時の一針は九針の手間を省く。"
  - country: fi
    kind: fact
    text:
      en: "Sisu: the Finnish word for the stubborn courage that keeps you going when things get tough."
      zh: "“Sisu”是芬兰语，指在艰难时刻坚持到底的顽强勇气。"
      fi: "Sisu: suomalainen sana sitkeälle rohkeudelle, joka kantaa vaikeinakin hetkinä."
      de: "„Sisu“: das finnische Wort für zähen Mut, der einen auch in schweren Zeiten weitermachen lässt."
      ja: "「シス」は、苦しい時にも前へ進ませる粘り強い勇気を表すフィンランド語。"
  - country: cn
    kind: proverb
    text:
      en: "Give someone a fish and they eat for a day; teach them to fish and they eat for life."
      zh: "授人以鱼，不如授人以渔。"
      fi: "Anna kala, ja ruokit päivän; opeta kalastamaan, ja ruokit koko elämän."
      de: "Gib jemandem einen Fisch, und er isst einen Tag; lehre ihn fischen, und er isst ein Leben lang."
      ja: "魚を与えるより、釣り方を教えよ。"
  - country: de
    kind: proverb
    text:
      en: "Whoever rests, rusts."
      zh: "停下来就会生锈。"
      fi: "Joka lepää, se ruostuu."
      de: "Wer rastet, der rostet."
      ja: "休む者は錆びる。"
  - country: jp
    kind: proverb
    text:
      en: "If you're in a hurry, take the long way round."
      zh: "越是着急，越要走稳妥的远路。"
      fi: "Jos on kiire, kulje kiertotietä."
      de: "Hast du es eilig, nimm den Umweg."
      ja: "急がば回れ。"
  - country: uk
    kind: proverb
    text:
      en: "Rome wasn't built in a day."
      zh: "罗马不是一天建成的。"
      fi: "Roomaa ei rakennettu päivässä."
      de: "Rom wurde nicht an einem Tag erbaut."
      ja: "ローマは一日にして成らず。"
  - country: fi
    kind: proverb
    text:
      en: "He who asks will not lose his way."
      zh: "爱问路的人不会迷路。"
      fi: "Ei kysyvä tieltä eksy."
      de: "Wer fragt, verirrt sich nicht."
      ja: "尋ねる者は道に迷わない。"
  - country: cn
    kind: proverb
    text:
      en: "An inch of time is worth an inch of gold."
      zh: "一寸光阴一寸金。"
      fi: "Tuuma aikaa on tuuman kultaa arvoinen."
      de: "Ein Zoll Zeit ist einen Zoll Gold wert."
      ja: "一寸の光陰は一寸の金。"
  - country: de
    kind: proverb
    text:
      en: "The morning hour has gold in its mouth."
      zh: "清晨时光贵如金。"
      fi: "Aamuhetki kullan kallis."
      de: "Morgenstund hat Gold im Mund."
      ja: "朝の時間は口に金をくわえている。"
  - country: jp
    kind: proverb
    text:
      en: "One time, one meeting: treasure each encounter, for it will never come again."
      zh: "一期一会：珍惜每一次相遇，因为它不会再来。"
      fi: "Yksi kerta, yksi kohtaaminen: vaali jokaista tapaamista, sillä se ei toistu."
      de: "Einmal, eine Begegnung: Schätze jedes Treffen, denn es kommt nie wieder."
      ja: "一期一会。"
  - country: uk
    kind: proverb
    text:
      en: "Actions speak louder than words."
      zh: "行动胜于言语。"
      fi: "Teot puhuvat enemmän kuin sanat."
      de: "Taten sagen mehr als Worte."
      ja: "行動は言葉よりも雄弁である。"
  - country: fi
    kind: fact
    text:
      en: "Finland has roughly three million saunas for about 5.6 million people."
      zh: "芬兰约有三百万个桑拿房，而人口约五百六十万。"
      fi: "Suomessa on noin kolme miljoonaa saunaa ja noin 5,6 miljoonaa asukasta."
      de: "Finnland hat rund drei Millionen Saunas bei etwa 5,6 Millionen Einwohnern."
      ja: "フィンランドには人口約560万人に対し、サウナがおよそ300万ある。"
  - country: cn
    kind: proverb
    text:
      en: "Dripping water wears through stone."
      zh: "滴水穿石。"
      fi: "Pisara pisaralta vesi kovertaa kiven."
      de: "Steter Tropfen höhlt den Stein."
      ja: "雨垂れ石を穿つ。"
  - country: de
    kind: proverb
    text:
      en: "What you can do today, don't put off until tomorrow."
      zh: "今日事，今日毕。"
      fi: "Mitä voit tehdä tänään, älä lykkää huomiseen."
      de: "Was du heute kannst besorgen, das verschiebe nicht auf morgen."
      ja: "今日できることを明日に延ばすな。"
  - country: jp
    kind: proverb
    text:
      en: "Even dust, piled up, becomes a mountain."
      zh: "积尘成山。"
      fi: "Pölystäkin kasautuu vuori."
      de: "Auch Staub wird, angehäuft, zum Berg."
      ja: "塵も積もれば山となる。"
  - country: uk
    kind: proverb
    text:
      en: "The proof of the pudding is in the eating."
      zh: "布丁好不好，吃了才知道。"
      fi: "Vanukkaan laadun näkee vasta syömällä."
      de: "Ob der Pudding gut ist, zeigt sich beim Essen."
      ja: "プディングの味は食べてみなければわからない。"
  - country: fi
    kind: proverb
    text:
      en: "Whoever reaches for the spruce top tumbles into the juniper."
      zh: "想够云杉树梢的人，反倒摔进杜松丛。"
      fi: "Joka kuuseen kurkottaa, se katajaan kapsahtaa."
      de: "Wer nach der Fichte greift, stürzt in den Wacholder."
      ja: "トウヒに手を伸ばす者は、ネズの茂みに転げ落ちる。"
  - country: cn
    kind: fact
    text:
      en: "Chinese astronomers recorded the supernova of 1054 AD; its remnant is today's Crab Nebula."
      zh: "中国天文学家记录了公元1054年的超新星，其遗迹就是今天的蟹状星云。"
      fi: "Kiinalaiset tähtitieteilijät kirjasivat vuoden 1054 supernovan, jonka jäänne on Rapusumu."
      de: "Chinesische Astronomen verzeichneten die Supernova von 1054, deren Überrest heute Krebsnebel heißt."
      ja: "中国の天文学者は1054年の超新星を記録した。その残骸が今のかに星雲だ。"
  - country: de
    kind: proverb
    text:
      en: "The early bird catches the worm."
      zh: "早起的鸟儿有虫吃。"
      fi: "Aikainen lintu madon nappaa."
      de: "Der frühe Vogel fängt den Wurm."
      ja: "早起きの鳥は虫を捕まえる。"
  - country: jp
    kind: proverb
    text:
      en: "Doing it is easier than worrying about it."
      zh: "做起来比担心要容易。"
      fi: "Tekeminen on helpompaa kuin murehtiminen."
      de: "Tun ist leichter als sich zu sorgen."
      ja: "案ずるより産むが易し。"
  - country: uk
    kind: fact
    text:
      en: "Britons drink around 100 million cups of tea every day."
      zh: "英国人每天大约喝一亿杯茶。"
      fi: "Britit juovat noin sata miljoonaa kupillista teetä päivässä."
      de: "Die Briten trinken täglich rund 100 Millionen Tassen Tee."
      ja: "イギリス人は毎日約1億杯の紅茶を飲む。"
  - country: fi
    kind: proverb
    text:
      en: "The forest answers the way you shout into it."
      zh: "你怎样对森林喊，森林就怎样回应你。"
      fi: "Niin metsä vastaa kuin sinne huudetaan."
      de: "Wie man in den Wald hineinruft, so schallt es heraus."
      ja: "森は呼びかけたとおりに答える。"
  - country: cn
    kind: proverb
    text:
      en: "Seeing once is better than hearing a hundred times."
      zh: "百闻不如一见。"
      fi: "Kerran nähty on parempi kuin sata kertaa kuultu."
      de: "Einmal sehen ist besser als hundertmal hören."
      ja: "百聞は一見に如かず。"
  - country: de
    kind: proverb
    text:
      en: "Everything has an end — only the sausage has two."
      zh: "凡事皆有尽头，只有香肠有两头。"
      fi: "Kaikella on loppunsa, paitsi makkaralla, jolla on kaksi."
      de: "Alles hat ein Ende, nur die Wurst hat zwei."
      ja: "何事にも終わりはある。ソーセージだけは終わりが二つ。"
  - country: jp
    kind: proverb
    text:
      en: "Dumplings over flowers: substance over style."
      zh: "花不如团子：实惠胜过风雅。"
      fi: "Nyytit ennen kukkia: sisältö ennen tyyliä."
      de: "Klöße statt Blüten: Nutzen vor Schönheit."
      ja: "花より団子。"
  - country: uk
    kind: proverb
    text:
      en: "Absence makes the heart grow fonder."
      zh: "离别使人更加思念。"
      fi: "Poissaolo kasvattaa kaipausta."
      de: "Abwesenheit lässt die Zuneigung wachsen."
      ja: "会えない時間が想いを深める。"
  - country: fi
    kind: joke
    text:
      en: "An introverted Finn looks at his own shoes when talking to you; an extroverted Finn looks at yours."
      zh: "内向的芬兰人和你说话时看自己的鞋，外向的芬兰人看你的鞋。"
      fi: "Introvertti suomalainen katsoo puhuessaan omia kenkiään, ekstrovertti sinun kenkiäsi."
      de: "Ein introvertierter Finne schaut beim Reden auf seine Schuhe, ein extrovertierter auf deine."
      ja: "内向的なフィンランド人は話す時に自分の靴を見る。外向的な人はあなたの靴を見る。"
  - country: cn
    kind: proverb
    text:
      en: "The old man lost his horse — who knows if it isn't a blessing?"
      zh: "塞翁失马，焉知非福。"
      fi: "Vanhus menetti hevosensa – kuka tietää, ettei se ollut onni?"
      de: "Der alte Mann verlor sein Pferd – wer weiß, ob es nicht ein Glück ist?"
      ja: "塞翁が馬。"
  - country: de
    kind: proverb
    text:
      en: "Everyone is the blacksmith of their own fortune."
      zh: "每个人都是自己幸福的铁匠。"
      fi: "Jokainen on oman onnensa seppä."
      de: "Jeder ist seines Glückes Schmied."
      ja: "誰もが自分の幸福の鍛冶屋である。"
  - country: jp
    kind: fact
    text:
      en: "Japan's Shinkansen trains have an average delay of under one minute."
      zh: "日本新干线列车的平均延误不到一分钟。"
      fi: "Japanin Shinkansen-junien keskimääräinen myöhästyminen on alle minuutin."
      de: "Der japanische Shinkansen ist im Schnitt weniger als eine Minute verspätet."
      ja: "新幹線の1列車あたりの平均遅延は1分未満。"
  - country: uk
    kind: proverb
    text:
      en: "An apple a day keeps the doctor away."
      zh: "一天一苹果，医生远离我。"
      fi: "Omena päivässä pitää lääkärin loitolla."
      de: "Ein Apfel am Tag hält den Doktor fern."
      ja: "一日一個のリンゴで医者いらず。"
  - country: fi
    kind: proverb
    text:
      en: "The work praises its maker."
      zh: "好作品自会称赞它的制作者。"
      fi: "Työ tekijäänsä kiittää."
      de: "Die Arbeit lobt ihren Meister."
      ja: "仕事がその作り手をほめる。"
  - country: cn
    kind: proverb
    text:
      en: "Want it too fast and you won't get there."
      zh: "欲速则不达。"
      fi: "Liika kiire estää perille pääsyn."
      de: "Wer zu schnell ans Ziel will, kommt nicht an."
      ja: "速さを求めれば、かえって達せず。"
  - country: de
    kind: proverb
    text:
      en: "Whoever says A must also say B."
      zh: "说了A，就得说B。"
      fi: "Joka sanoo A, sen on sanottava myös B."
      de: "Wer A sagt, muss auch B sagen."
      ja: "Aと言った者はBとも言わねばならない。"
  - country: jp
    kind: proverb
    text:
      en: "After the rain, the ground hardens."
      zh: "雨后地更坚实。"
      fi: "Sateen jälkeen maa kovettuu."
      de: "Nach dem Regen wird der Boden fest."
      ja: "雨降って地固まる。"
  - country: uk
    kind: proverb
    text:
      en: "Better safe than sorry."
      zh: "安全第一，免得后悔。"
      fi: "Parempi katsoa kuin katua."
      de: "Vorsicht ist besser als Nachsicht."
      ja: "後悔するより安全策を。"
  - country: fi
    kind: proverb
    text:
      en: "The morning is wiser than the evening."
      zh: "早晨比夜晚更有智慧。"
      fi: "Aamu on iltaa viisaampi."
      de: "Der Morgen ist klüger als der Abend."
      ja: "朝は夜より賢い。"
  - country: cn
    kind: proverb
    text:
      en: "Sharpening the axe doesn't delay the woodcutting."
      zh: "磨刀不误砍柴工。"
      fi: "Kirveen teroittaminen ei hidasta puiden hakkuuta."
      de: "Das Schärfen der Axt hält das Holzhacken nicht auf."
      ja: "刃を研ぐ時間は薪割りの遅れにならない。"
  - country: de
    kind: fact
    text:
      en: "Wolfgang Paul of Bonn shared the 1989 Nobel Prize in Physics for the ion trap that bears his name."
      zh: "波恩的沃尔夫冈·保罗因以他命名的离子阱分享了1989年诺贝尔物理学奖。"
      fi: "Bonnin Wolfgang Paul sai jaetun fysiikan Nobelin 1989 hänen mukaansa nimetystä ioniloukusta."
      de: "Wolfgang Paul aus Bonn erhielt 1989 anteilig den Physik-Nobelpreis für die nach ihm benannte Ionenfalle."
      ja: "ボンのヴォルフガング・パウルは、自らの名を冠したイオントラップで1989年ノーベル物理学賞を共同受賞した。"
  - country: jp
    kind: proverb
    text:
      en: "Getting up early is worth three coins."
      zh: "早起有三文钱的好处。"
      fi: "Aamuvirkku saa kolme kolikkoa."
      de: "Früh aufstehen bringt drei Münzen."
      ja: "早起きは三文の徳。"
  - country: uk
    kind: joke
    text:
      en: "British weather: four seasons in one day, and an umbrella for each."
      zh: "英国天气：一天四季，每季一把伞。"
      fi: "Brittiläinen sää: neljä vuodenaikaa päivässä ja sateenvarjo jokaiseen."
      de: "Britisches Wetter: vier Jahreszeiten an einem Tag – und für jede einen Schirm."
      ja: "イギリスの天気：一日に四季があり、季節ごとに傘が要る。"
  - country: fi
    kind: fact
    text:
      en: "Finns drink more coffee per person than almost anyone on Earth: around ten kilos a year."
      zh: "芬兰人均咖啡消费量几乎世界第一，每年约十公斤。"
      fi: "Suomalaiset juovat kahvia henkeä kohden lähes eniten maailmassa, noin kymmenen kiloa vuodessa."
      de: "Finnen trinken pro Kopf fast den meisten Kaffee der Welt – rund zehn Kilo im Jahr."
      ja: "フィンランド人の一人当たりコーヒー消費量は世界トップ級で、年に約10キロ。"
  - country: cn
    kind: proverb
    text:
      en: "Failure is the mother of success."
      zh: "失败是成功之母。"
      fi: "Epäonnistuminen on menestyksen äiti."
      de: "Misserfolg ist die Mutter des Erfolgs."
      ja: "失敗は成功のもと。"
  - country: de
    kind: proverb
    text:
      en: "Small livestock makes manure too: little things add up."
      zh: "小牲口也积肥：积少成多。"
      fi: "Pienistäkin eläimistä kertyy lantaa: vähästä kertyy paljon."
      de: "Kleinvieh macht auch Mist."
      ja: "小さな家畜も肥やしになる。小さなことも積み重なる。"
  - country: jp
    kind: proverb
    text:
      en: "The clever hawk hides its claws."
      zh: "能干的鹰把爪子藏起来。"
      fi: "Taitava haukka kätkee kyntensä."
      de: "Der kluge Falke verbirgt seine Krallen."
      ja: "能ある鷹は爪を隠す。"
  - country: uk
    kind: proverb
    text:
      en: "Birds of a feather flock together."
      zh: "物以类聚，人以群分。"
      fi: "Vakka kantensa valitsee."
      de: "Gleich und gleich gesellt sich gern."
      ja: "類は友を呼ぶ。"
  - country: fi
    kind: proverb
    text:
      en: "Diligence beats even hard luck."
      zh: "勤奋能战胜坏运气。"
      fi: "Ahkeruus kovankin onnen voittaa."
