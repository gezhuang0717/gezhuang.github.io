# ─────────────────────────────────────────────────────────────────────────────
# Publication database — the ONE place to edit papers.
# Every language version of the site (and the React site, after
# `python3 tools/site.py export-react`) reads this file.
#
# Fields (only title + year + role are required):
#   role:      first | corresponding | coauthor
#   position:  my place in the author list (1 = first). Papers with role first or
#              corresponding, or position 2, form the "Main papers" list.
#   year:      publication year (number)
#   authors:   author string; Markdown allowed, **Z. Ge** is bolded
#   title:     paper title (Unicode superscripts such as ¹⁰⁰Sn are fine)
#   journal, volume, pages
#   doi:       bare DOI, e.g. 10.1103/PhysRevC.103.065502  (link is built)
#   arxiv:     bare arXiv id, e.g. 2103.08729
#   url:       direct link when there is no DOI
#   note:      short extra text shown after the reference (Markdown allowed)
#   themes:    research themes this paper appears under on the Research page:
#              nz | neutrino | isotope-shift | detectors
#   highlight: true → listed under "Highlights" on the Publications page
# Add a paper: copy a block, edit, keep newest first (order is not required;
# lists are sorted by year automatically).
# Command-line helpers: python3 tools/site.py pub-add --help
#                       python3 tools/site.py pub-doi 10.1103/xxxx
# ─────────────────────────────────────────────────────────────────────────────
