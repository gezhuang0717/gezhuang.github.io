# ─────────────────────────────────────────────────────────────────────────────
# Automatic daily sources for the Daily calendar.
# `python3 tools/site.py fetch` (and the daily GitHub Action) reads this file.
#
# kind: arxiv         → arXiv API search (query syntax: https://info.arxiv.org/help/api/user-manual.html)
#       inspire_jobs  → INSPIRE-HEP job board, filtered by arXiv categories
#       rss           → any RSS 2.0 / RSS 1.0 / Atom news feed
# type:    entry type shown in the calendar (paper | news | job | event | log)
# include: keep an item only if title/summary contains one of these words
# exclude: drop an item if it contains one of these words
# days:    look back this many days     keep: at most this many new items per run
# enabled: false → skip this source
# Add a source: copy a block and change name/url/query.
# ─────────────────────────────────────────────────────────────────────────────
feeds:
  - name: "arXiv — ion traps & mass spectrometry"
    kind: arxiv
    type: preprint
    query: '(cat:nucl-ex OR cat:physics.ins-det OR cat:physics.atom-ph) AND (abs:"Penning trap" OR abs:"ion trap" OR abs:"MR-TOF" OR abs:"multi-reflection" OR abs:"mass spectrometry" OR abs:"cooler-buncher")'
    include: [trap, mass, time-of-flight, buncher, ion]
    tags: [trap]
    days: 4
    max: 40
    keep: 8

  - name: "arXiv — nuclear masses, Q-values & astrophysics"
    kind: arxiv
    type: preprint
    query: '(cat:nucl-ex OR cat:nucl-th) AND (abs:"mass measurement" OR abs:"Q value" OR abs:"Q-value" OR abs:"neutrino mass" OR abs:"rp-process" OR abs:"r-process" OR abs:"isomer")'
    tags: [nuclear]
    days: 4
    max: 40
    keep: 8

  - name: "INSPIRE-HEP Jobs — nuclear physics"
    kind: inspire_jobs
    query: "status:open"
    categories: [nucl-ex, nucl-th, physics.ins-det]
    tags: [nuclear]
    days: 4
    max: 100
    keep: 10

  - name: "APS Physics — news"
    kind: rss
    type: news
    url: "https://feeds.aps.org/rss/recent/physics.xml"
    include: [nucle, nuclear, isotope, neutrino, trap, ion, mass, atom, quantum, astrophys]
    tags: [nuclear]
    keep: 5

  - name: "Phys.org — nuclear physics"
    kind: rss
    type: news
    url: "https://phys.org/rss-feed/physics-news/nuclear-physics/"
    tags: [nuclear]
    keep: 5

  # ── verified journal feeds (checked 2026-10-04) ──────────────────────────
  - name: "Physical Review Letters — Nuclear Physics"
    kind: rss
    type: paper
    url: "http://feeds.aps.org/rss/tocsec/PRL-NuclearPhysics.xml"
    tags: [nuclear, journal]
    keep: 8

  - name: "Physical Review Letters — traps, masses & astrophysics"
    kind: rss
    type: paper
    url: "http://feeds.aps.org/rss/recent/prl.xml"
    include: [Penning, ion trap, trapped ion, mass spectrom, storage ring, nucleosynthesis, r-process, rp-process, neutrino mass, isotope shift, nuclear clock]
    exclude: [Nuclear Physics]
    tags: [journal]
    keep: 5

  - name: "Physical Review C"
    kind: rss
    type: paper
    url: "http://feeds.aps.org/rss/recent/prc.xml"
    include: [mass, Penning, trap, Q value, Q-value, storage ring, isomer, beta decay, β decay, N=Z, N = Z, r-process, rp-process, astrophys, half-li, shell]
    tags: [nuclear, journal]
    keep: 8

  - name: "Nature Physics"
    kind: rss
    type: paper
    url: "https://www.nature.com/nphys.rss"
    include: [nucle, isotope, ion, trap, neutrino, atomic clock, antimatter, mass]
    tags: [journal]
    keep: 3

  # ── verified facility / community news (checked 2026-10-04) ──────────────
  - name: "TRIUMF news"
    kind: rss
    type: news
    url: "https://triumf.ca/feed"
    tags: [facility]
    keep: 3

  - name: "GANIL news"
    kind: rss
    type: news
    url: "https://www.ganil-spiral2.eu/feed/"
    tags: [facility]
    keep: 3

  - name: "ECT* news & workshops"
    kind: rss
    type: event
    url: "https://www.ectstar.eu/feed/"
    tags: [workshop]
    keep: 3

  - name: "IAEA — nuclear science news"
    kind: rss
    type: news
    url: "https://www.iaea.org/feeds/topnews"
    include: [nuclear data, research reactor, accelerator, isotope, physics, science]
    tags: [facility]
    keep: 2

  - name: "Ion Traps Newsletter (iontraps.net)"
    kind: rss
    type: news
    url: "https://iontraps.net/feed/"
    tags: [trap]
    keep: 2

