name: Publish preserved baseline
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preserved-baseline-pages
  cancel-in-progress: false
env:
  HUGO_VERSION: 0.166.0
  SITE_BASE_URL: https://gezhuang0717.github.io/gezhuang.github.io/
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Install pinned Hugo Extended
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hugo.deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - name: Reuse original locked dependency subgraph
        run: corepack pnpm --dir tools/react-toolchain install --frozen-lockfile
      - name: Validate frozen baseline data
        run: |
          python tools/site.py check
          python -m pytest tests -q
          python tools/site.py config
          python tools/site.py facilities-build
          python tools/site.py export-react
          # The saved baseline remains fixed; do not refresh Daily feeds or its saved asset.
          git restore --source HEAD -- static/data/daily.json
      - name: Publication gate
        run: python tools/publish.py check --base-url "$SITE_BASE_URL"
      - name: Original themes and React with project paths
        run: |
          git restore --source HEAD -- static/data
          for theme in congo blowfish papermod; do
            hugo --minify --configDir "sites/$theme" --themesDir themes --destination "builds/$theme" --baseURL "$SITE_BASE_URL"
          done
          python tools/build_react.py --node "$(command -v node)" --toolchain tools/react-toolchain --output builds/react
          # Only generated build directories are removed on this disposable runner.
          theme=$(python -c "import yaml;print(yaml.safe_load(open('site.yaml'))['live_theme'])")
          rm -rf public && mv "builds/$theme" public
          cp -R builds/react public/react
      - uses: actions/upload-artifact@v4
        with:
          name: preserved-baseline-website
          path: public
  deploy:
    needs: validate
    if: github.repository == 'gezhuang0717/gezhuang.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preserved-baseline-website
          path: public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
