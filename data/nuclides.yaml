# "Nuclide of the day" — 366 entries, one per day of the year ({{< nuclide-of-the-day >}}).
# Hand-written entries first (edit freely). Entries with generated: true come from
# tools/make_nuclides.py (ICRP-107 decay data + IUPAC abundances); re-run it to refill.
nuclides:
- sym: ¹²C
  fact:
    en: 'Defines the atomic mass unit: one atom of carbon-12 weighs exactly 12 u.'
    zh: 定义了原子质量单位：一个碳-12原子的质量恰好是12 u。
    fi: 'Määrittelee atomimassayksikön: yksi hiili-12-atomi painaa tasan 12 u.'
    de: 'Definiert die atomare Masseneinheit: Ein Kohlenstoff-12-Atom wiegt genau 12 u.'
    ja: 原子質量単位の基準：炭素12原子1個の質量はちょうど12 uです。
- sym: ¹⁰⁰Sn
  fact:
    en: Doubly magic with N = Z = 50 — the heaviest doubly magic nucleus with equal numbers of protons and neutrons.
    zh: 双幻核，N = Z = 50 —— 质子数与中子数相等的最重双幻核。
    fi: Kaksoismaaginen, N = Z = 50 — raskain kaksoismaaginen ydin, jossa on yhtä monta protonia ja neutronia.
    de: Doppelt magisch mit N = Z = 50 – der schwerste doppelt magische Kern mit gleich vielen Protonen und Neutronen.
    ja: N = Z = 50 の二重魔法核。陽子数と中性子数が等しい二重魔法核の中で最も重い核です。
- sym: ⁵⁶Ni
  fact:
    en: Doubly magic (N = Z = 28); its decay chain ⁵⁶Ni → ⁵⁶Co → ⁵⁶Fe powers the light curves of supernovae.
    zh: 双幻核（N = Z = 28）；衰变链 ⁵⁶Ni → ⁵⁶Co → ⁵⁶Fe 为超新星光变曲线提供能量。
    fi: Kaksoismaaginen (N = Z = 28); hajoamisketju ⁵⁶Ni → ⁵⁶Co → ⁵⁶Fe saa supernovat loistamaan.
    de: Doppelt magisch (N = Z = 28); die Zerfallskette ⁵⁶Ni → ⁵⁶Co → ⁵⁶Fe speist die Lichtkurven von Supernovae.
    ja: 二重魔法核（N = Z = 28）。崩壊系列 ⁵⁶Ni → ⁵⁶Co → ⁵⁶Fe が超新星の光度曲線のエネルギー源です。
- sym: ⁶²Ni
  fact:
    en: Has the highest binding energy per nucleon of any nucleus — slightly above the famous ⁵⁶Fe.
    zh: 所有原子核中每核子结合能最高的核 —— 略高于著名的 ⁵⁶Fe。
    fi: Sillä on suurin sidosenergia nukleonia kohden kaikista ytimistä — hieman enemmän kuin kuuluisalla ⁵⁶Fe:llä.
    de: Hat die höchste Bindungsenergie pro Nukleon aller Kerne – knapp über dem berühmten ⁵⁶Fe.
    ja: 核子あたりの結合エネルギーが全原子核中で最大。有名な ⁵⁶Fe をわずかに上回ります。
- sym: ³H
  fact:
    en: Tritium β decay (Q ≈ 18.6 keV) is used by KATRIN to set the tightest direct limit on the neutrino mass.
    zh: 氚的β衰变（Q ≈ 18.6 keV）被KATRIN实验用来给出最严格的中微子质量直接上限。
    fi: Tritiumin β-hajoamista (Q ≈ 18,6 keV) käyttää KATRIN, joka antaa tiukimman suoran rajan neutriinon massalle.
    de: Der Tritium-β-Zerfall (Q ≈ 18,6 keV) liefert bei KATRIN die strengste direkte Grenze für die Neutrinomasse.
    ja: トリチウムのβ崩壊（Q ≈ 18.6 keV）は、KATRIN がニュートリノ質量の最も厳しい直接上限を得るのに使われています。
- sym: ¹⁶³Ho
  fact:
    en: Electron capture with Q ≈ 2.8 keV — the ECHo and HOLMES experiments use it to weigh the neutrino.
    zh: 电子俘获Q值约2.8 keV —— ECHo与HOLMES实验利用它来“称量”中微子。
    fi: Elektronisieppaus, Q ≈ 2,8 keV — ECHo- ja HOLMES-kokeet käyttävät sitä neutriinon punnitsemiseen.
    de: Elektroneneinfang mit Q ≈ 2,8 keV – ECHo und HOLMES nutzen ihn, um das Neutrino zu „wiegen“.
    ja: 電子捕獲の Q 値は約 2.8 keV。ECHo や HOLMES 実験がニュートリノの質量測定に利用しています。
- sym: ¹⁸⁷Re
  fact:
    en: Its β⁻ decay has a Q value of only about 2.5 keV and a half-life of about 4 × 10¹⁰ years — longer than the age of the Universe.
    zh: 它的β⁻衰变Q值仅约2.5 keV，半衰期约4 × 10¹⁰年 —— 比宇宙年龄还长。
    fi: Sen β⁻-hajoamisen Q-arvo on vain noin 2,5 keV ja puoliintumisaika noin 4 × 10¹⁰ vuotta — pidempi kuin maailmankaikkeuden ikä.
    de: Sein β⁻-Zerfall hat einen Q-Wert von nur etwa 2,5 keV und eine Halbwertszeit von rund 4 × 10¹⁰ Jahren – länger als das Alter des Universums.
    ja: β⁻ 崩壊の Q 値はわずか約 2.5 keV、半減期は約 4 × 10¹⁰ 年で、宇宙の年齢より長いのです。
- sym: ¹¹⁵In
  fact:
    en: One of its β⁻ branches, to an excited state of ¹¹⁵Sn, has an ultra-low Q value of roughly 0.15 keV — first pinned down with JYFLTRAP.
    zh: 它衰变到 ¹¹⁵Sn 激发态的β⁻分支Q值极低，约0.15 keV —— 首先由JYFLTRAP精确测定。
    fi: Sen β⁻-haara ¹¹⁵Sn:n viritettyyn tilaan on erittäin matala, Q ≈ 0,15 keV — tarkennettu ensimmäisenä JYFLTRAPilla.
    de: Ein β⁻-Zweig in einen angeregten Zustand von ¹¹⁵Sn hat einen extrem kleinen Q-Wert von rund 0,15 keV – zuerst mit JYFLTRAP genau bestimmt.
    ja: ¹¹⁵Sn の励起状態への β⁻ 分岐の Q 値は約 0.15 keV と極めて小さく、JYFLTRAP で初めて精密に決定されました。
- sym: ⁴⁵Sc
  fact:
    en: Its 12.4 keV isomer is extremely narrow, making scandium-45 a candidate for an ultra-precise nuclear clock.
    zh: 其12.4 keV同质异能态线宽极窄，使钪-45成为超高精度“核钟”的候选者。
    fi: Sen 12,4 keV:n isomeeri on äärimmäisen kapea, joten skandium-45 on ehdokas erittäin tarkaksi ydinkelloksi.
    de: Sein 12,4-keV-Isomer ist extrem schmal – Scandium-45 ist daher ein Kandidat für eine ultrapräzise Kernuhr.
    ja: 12.4 keV の核異性体の線幅が極めて狭く、スカンジウム45は超高精度な原子核時計の候補です。
- sym: ⁶⁴Ge
  fact:
    en: 'A waiting point of the rp-process in X-ray bursts: the flow of proton captures stalls here until it decays.'
    zh: X射线暴中rp过程的“等待点”：质子俘获流在此停滞，直到它衰变。
    fi: 'rp-prosessin odotuspiste röntgenpurkauksissa: protonikaappausten virta pysähtyy, kunnes ydin hajoaa.'
    de: 'Ein Wartepunkt des rp-Prozesses in Röntgenbursts: Der Fluss der Protoneneinfänge stockt hier, bis der Kern zerfällt.'
    ja: X線バーストにおける rp 過程の待機点。崩壊するまで陽子捕獲の流れがここで滞ります。
- sym: ²⁰⁹Bi
  fact:
    en: Long thought stable — it actually α-decays, with a half-life of about 2 × 10¹⁹ years.
    zh: 长期被认为是稳定的 —— 实际上它会α衰变，半衰期约2 × 10¹⁹年。
    fi: Pitkään pidetty stabiilina — se kuitenkin α-hajoaa, puoliintumisaika noin 2 × 10¹⁹ vuotta.
    de: Lange für stabil gehalten – tatsächlich zerfällt es per α-Zerfall mit einer Halbwertszeit von etwa 2 × 10¹⁹ Jahren.
    ja: 長く安定と考えられていましたが、実は半減期約 2 × 10¹⁹ 年で α 崩壊します。
- sym: ¹³³Cs
  fact:
    en: Its atomic hyperfine transition defines the SI second — and ¹³³Cs⁺ is a favourite mass reference ion at JYFLTRAP.
    zh: 其原子超精细跃迁定义了国际单位制的“秒” —— ¹³³Cs⁺ 也是JYFLTRAP常用的质量参考离子。
    fi: Sen atomin hyperhienosiirtymä määrittelee SI-sekunnin — ja ¹³³Cs⁺ on JYFLTRAPin suosittu massareferenssi-ioni.
    de: Sein atomarer Hyperfeinübergang definiert die SI-Sekunde – und ¹³³Cs⁺ ist an JYFLTRAP ein beliebtes Referenzion.
    ja: 原子の超微細遷移が SI の「秒」を定義。¹³³Cs⁺ は JYFLTRAP でよく使われる質量参照イオンでもあります。
- sym: ⁹⁹Tc
  fact:
    en: Technetium is the lightest element with no stable isotope; ⁹⁹ᵐTc is the most widely used medical radioisotope.
    zh: 锝是没有稳定同位素的最轻元素；⁹⁹ᵐTc 是应用最广的医用放射性同位素。
    fi: Teknetium on kevein alkuaine, jolla ei ole stabiilia isotooppia; ⁹⁹ᵐTc on käytetyin lääketieteellinen radioisotooppi.
    de: Technetium ist das leichteste Element ohne stabiles Isotop; ⁹⁹ᵐTc ist das meistgenutzte medizinische Radioisotop.
    ja: テクネチウムは安定同位体をもたない最も軽い元素。⁹⁹ᵐTc は最も広く使われる医療用放射性同位体です。
- sym: ²²⁹Th
  fact:
    en: Has a nuclear isomer at only about 8.4 eV — low enough to be excited with a laser, the basis of the thorium nuclear clock.
    zh: 拥有能量仅约8.4 eV的同质异能态 —— 低到可以用激光激发，是钍核钟的基础。
    fi: Sillä on vain noin 8,4 eV:n isomeeri — niin matala, että sen voi virittää laserilla; toriumydinkellon perusta.
    de: Besitzt ein Kernisomer bei nur etwa 8,4 eV – niedrig genug für Laseranregung, die Grundlage der Thorium-Kernuhr.
    ja: わずか約 8.4 eV の核異性体をもち、レーザーで励起できます。トリウム原子核時計の基礎です。
